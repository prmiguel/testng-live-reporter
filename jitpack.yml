# JitPack build configuration.
#
# The default JitPack image runs JDK 17, but this project compiles with
# maven.compiler.release=21, so the JDK is selected explicitly here.
# JitPack reports this as "Using JDK from jitpack.yml" in the build log.
jdk:
  - openjdk21
install:
  - ./mvnw -B -ntp install -DskipTests
